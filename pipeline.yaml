# Pipeline orchestrator config — see src/lowork/pipeline.py and README.
#
# `companies` is the universe. Each story is either `true` (enabled, all
# companies) or a mapping with an optional `companies` allow-list (a curated
# subset). Adding a company here auto-includes it in every story EXCEPT those
# with an explicit allow-list. Membership filters EXPORTS; per-company analysis
# still runs for whatever any enabled story needs (union).

companies:
  [
    google,
    amazon,
    meta,
    palantir,
    coinbase,
    netflix,
    shopify,
    stripe,
    airbnb,
    snap,
    hubspot,
    gitlab,
    github,
    basecamp,
    salesforce,
    starbucks,
    uber,
    apple,
    nvidia,
    engine,
    # 2026-07-23 additions: in the exclusion + gender-language stories only;
    # every legacy story pins an explicit allow-list that omits them.
    anduril,
    spacex,
    ramp,
    x, # canon-primary: the ultimatum doc, careers page is a JS shell (exclusion only — no careers corpus for gender-language)
  ]

# Every company gets an individual page; the per-company exports run for all of
# them. TODO(content): per-company page content/design is only finalized for
# [google, amazon, meta, palantir, coinbase, netflix]; the rest get exported
# data but still need their page content designed.

stories:
  # Altruism cohort excludes palantir (2026-07-21): persistent outlier — its
  # "idealism" is the civilizational-mission register (dei study territory),
  # and it's the one company where the tournament judge GENUINELY disputes the
  # embedding ranking (42% duel agreement on confident pairs vs 91-95% for
  # passing companies). Its trend isn't citable; excluding beats caveating.
  altruism:
    enabled: true
    companies:
      [
        google,
        amazon,
        meta,
        coinbase,
        netflix,
        shopify,
        stripe,
        airbnb,
        snap,
        hubspot,
        gitlab,
        github,
        basecamp,
        salesforce,
        starbucks,
        uber,
        apple,
        nvidia,
      ]
  # ai/performance/wellbeing/power/benefits/dei/profiles: pinned to the
  # pre-exclusion-story universe (2026-07-23) so anduril/spacex stay scoped to
  # the exclusion story only. Same 20-company list in each; edit together.
  ai:
    enabled: true # story axis: mention tracker + tool<->mandate framing; surfaced via the craft-ai story page
    companies: [google, amazon, meta, palantir, coinbase, netflix, shopify, stripe, airbnb, snap, hubspot, gitlab, github, basecamp, salesforce, starbucks, uber, apple, nvidia, engine]
  performance:
    enabled: true
    companies: [google, amazon, meta, palantir, coinbase, netflix, shopify, stripe, airbnb, snap, hubspot, gitlab, github, basecamp, salesforce, starbucks, uber, apple, nvidia, engine]
  wellbeing:
    enabled: true # story axis: dataset exported; story page at astro/src/content/stories/wellbeing.mdx
    companies: [google, amazon, meta, palantir, coinbase, netflix, shopify, stripe, airbnb, snap, hubspot, gitlab, github, basecamp, salesforce, starbucks, uber, apple, nvidia, engine]
  power:
    enabled: true
    companies: [google, amazon, meta, palantir, coinbase, netflix, shopify, stripe, airbnb, snap, hubspot, gitlab, github, basecamp, salesforce, starbucks, uber, apple, nvidia, engine]
  benefits:
    enabled: true
    companies: [google, amazon, meta, palantir, coinbase, netflix, shopify, stripe, airbnb, snap, hubspot, gitlab, github, basecamp, salesforce, starbucks, uber, apple, nvidia, engine]
  dei:
    enabled: true
    companies: [google, amazon, meta, palantir, coinbase, netflix, shopify, stripe, airbnb, snap, hubspot, gitlab, github, basecamp, salesforce, starbucks, uber, apple, nvidia, engine]
  # NEW story pilot (2026-07-23): exclusionary / anti-recruiting register,
  # working title "You probably don't belong here". Pilot memo:
  # docs/exclusion-story-pilot.md. ramp/flock(/x-canon) join once profiles and
  # captures exist — flock has ZERO wayback, manual-capture only.
  # Corpus design (Becca, 2026-07-23): this story reads canon documents
  # (data/<company>/canon/*.md — the deck, the coinbase essays, the X
  # ultimatum, the anduril campaign) ALONGSIDE careers-page chunks, tagged by
  # register; comparisons stay within-register (manifesto-voice confound).
  exclusion:
    enabled: true
    companies: [netflix, coinbase, engine, palantir, anduril, spacex, ramp, x]
  # Gender-coded language story (Becca, 2026-07-23): Kozlowski-style gender
  # axis over careers-page copy. ALL corpus companies, NO canon documents —
  # deliberately the inverse of the exclusion story's corpus design. x is out
  # (canon-only company, no careers corpus).
  gender-language:
    enabled: true
    companies: [google, amazon, meta, palantir, coinbase, netflix, shopify, stripe, airbnb, snap, hubspot, gitlab, github, basecamp, salesforce, starbucks, uber, apple, nvidia, engine, anduril, spacex, ramp]
  # Performance-culture lineage cohort. Basecamp ADDED 2026-07-23: it lifts the
  # deck's minimize-complexity rule (0.648, 2014) while rejecting the intensity
  # register ("calm company") — the counter-lineage; its simplicity doctrine
  # predates the deck, so the chronology view carries the convergence caveat.
  # Still excludes starbucks/uber/apple/nvidia (2026-07-23 scan: no echoes
  # beyond the raise_the_bar/only_the_best convergence zone).
  netflix-culture:
    enabled: true
    companies:
      [
        google,
        amazon,
        meta,
        palantir,
        coinbase,
        netflix,
        shopify,
        stripe,
        airbnb,
        snap,
        hubspot,
        gitlab,
        github,
        salesforce,
        engine,
        basecamp,
      ]
  profiles:
    enabled: true # per-company AI narrative on /explore/[company] (not a story export)
    companies: [google, amazon, meta, palantir, coinbase, netflix, shopify, stripe, airbnb, snap, hubspot, gitlab, github, basecamp, salesforce, starbucks, uber, apple, nvidia, engine]
