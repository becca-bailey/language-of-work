# Pipeline orchestrator config — see src/lowork/pipeline.py and README.
#
# `companies` is the universe. Each story is either `true` (enabled, all
# companies) or a mapping with an optional `companies` allow-list (a curated
# subset). Adding a company here auto-includes it in every story EXCEPT those
# with an explicit allow-list. Membership filters EXPORTS; per-company analysis
# still runs for whatever any enabled story needs (union).

companies:
  [
    google,
    amazon,
    meta,
    palantir,
    coinbase,
    netflix,
    shopify,
    stripe,
    airbnb,
    snap,
    hubspot,
    gitlab,
    github,
    basecamp,
    salesforce,
    starbucks,
    uber,
    apple,
    nvidia,
  ]

# Every company gets an individual page; the per-company exports run for all of
# them. TODO(content): per-company page content/design is only finalized for
# [google, amazon, meta, palantir, coinbase, netflix]; the rest get exported
# data but still need their page content designed.

stories:
  altruism: true
  ai: true # story axis: mention tracker + tool<->mandate framing; no story page yet
  performance: true
  wellbeing: true # story axis: dataset exported, no story page written yet
  power: true
  benefits: true
  dei: true # to curate: replace `true` with {enabled: true, companies: [...]}
  # Performance-culture lineage cohort: excludes basecamp (the anti-intensity
  # counterpoint) and starbucks (out-of-sector retail) so they don't dilute the
  # propagation echoes or the objectivity scan. Salesforce kept in.
  netflix-culture:
    enabled: true
    companies: [google, amazon, meta, palantir, coinbase, netflix, shopify, stripe, airbnb, snap, hubspot, gitlab, github, salesforce]
  profiles: true # per-company AI narrative on /explore/[company] (not a story export)
