# Mission <-> Rights — does the firm frame its values as a PURPOSE it pursues for
# others, or as PROPERTY it owns and defends? Serves H1 (capture under stress:
# language shifts mission -> rights around conflict events) and H5 (Pathway B/
# Automattic: liturgical mission canon co-existing with rights-register conduct).
# Both poles in corporate first-person voice so register cancels in subtraction.
#
# IMPORTANT: poles state the *concept* generically; no firm's verbatim slogan
# (e.g. "democratize publishing") appears, or projecting that firm's canon onto
# the axis would be lexically circular and H5 could not falsify. (See build log.)
name: mission_rights
pole_a:
  label: mission
  sentences:
    - "Our purpose is bigger than profit — we want to leave the world better than we found it."
    - "We exist to empower people and give everyone a voice."
    - "We're driven by a mission we believe in, not just by the bottom line."
    - "We give back to our community and believe in openness and generosity."
    - "We want our work to genuinely improve people's lives."
    - "We're here to serve a cause larger than ourselves."
    - "We believe in sharing what we make and lifting others up."
    - "We measure ourselves by the good we do, not only by what we earn."
pole_b:
  label: rights
  sentences:
    - "We will protect our trademark and enforce our marks consistently."
    - "Unauthorized use of our brand is infringement, and we will take action."
    - "Use of our intellectual property requires a proper license."
    - "We must protect the goodwill and value associated with our name."
    - "Those who violate our terms will hear from our legal team."
    - "We reserve all rights to our brand, our marks, and our proprietary methods."
    - "Commercial use without a license agreement will not be tolerated."
    - "We are obligated to defend our intellectual property, in court if necessary."
